<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulChord 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: transparent;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; color: #e0e0e0;
    -webkit-app-region: drag;
    user-select: none;
  }
  .container {
    text-align: center;
    width: 340px;
  }
  h1 {
    font-size: 22px; font-weight: 600;
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 20px;
    border: 3px solid #2a2a3e;
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .services { text-align: left; margin-top: 8px; }
  .service {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; margin: 3px 0;
    border-radius: 6px; background: rgba(255,255,255,0.04);
    font-size: 13px;
  }
  .service .name { color: #ccc; }
  .service .status { font-size: 12px; }
  .status.starting { color: #fbbf24; }
  .status.healthy { color: #34d399; }
  .status.failed { color: #f87171; }
  .status.skipped { color: #888; }
  .footer { margin-top: 14px; font-size: 11px; color: #666; }
</style>
</head>
<body>
<div class="container">
  <h1>SoulChord</h1>
  <div class="subtitle">AI 音乐电台</div>
  <div class="spinner" id="spinner"></div>
  <div class="services" id="services"></div>
  <div class="footer" id="footer">正在启动后端服务…</div>
</div>
<script>
const BACKENDS = [
  { name: 'NeteaseCloudMusicApi', label: '网易云音乐 API', port: 3000 },
  { name: 'MusicAgentAPI', label: '音乐代理服务', port: 8081 },
  { name: 'QQMusicApi', label: 'QQ 音乐 API', port: 8082 },
  { name: 'AgentRuntime', label: 'AI 电台主服务', port: 8000 },
]

let statusMap = {}
const servicesEl = document.getElementById('services')
const spinnerEl = document.getElementById('spinner')
const footerEl = document.getElementById('footer')

function render() {
  servicesEl.innerHTML = BACKENDS.map(b => {
    const s = statusMap[b.name] || 'starting'
    const statusText = { starting: '启动中…', healthy: '已就绪', failed: '失败', skipped: '跳过' }[s] || s
    return `<div class="service">
      <span class="name">${b.label}</span>
      <span class="status ${s}">${statusText}</span>
    </div>`
  }).join('')

  const allDone = BACKENDS.every(b => {
    const s = statusMap[b.name]
    return s === 'healthy' || s === 'skipped' || s === 'failed'
  })
  if (allDone) {
    spinnerEl.style.display = 'none'
    const hasFailed = BACKENDS.some(b => statusMap[b.name] === 'failed')
    footerEl.textContent = hasFailed ? '部分服务未启动，请稍候…' : '启动完成！'
  }
}

// ── Listen for updates from Electron main process ──
if (window.electronAPI) {
  window.electronAPI.onBackendUpdate((update) => {
    statusMap[update.name] = update.status
    render()
  })
  window.electronAPI.onBackendStatus((statuses) => {
    statuses.forEach(s => { statusMap[s.name] = s.healthy ? 'healthy' : (s.running ? 'starting' : 'failed') })
    render()
  })
  // Initial poll
  window.electronAPI.getBackendStatuses().then(statuses => {
    statuses.forEach(s => { statusMap[s.name] = s.healthy ? 'healthy' : (s.running ? 'starting' : 'failed') })
    render()
  })
}

// Fallback: render immediately with starting status
render()
</script>
</body>
</html>
