appId: com.soulchord.app
productName: SoulChord
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
extraResources:
  - from: ../../dist_py/agent/agent
    to: backend/agent
    filter:
      - "**/*"
  - from: ../../dist_py/music_api/music_api
    to: backend/music_api
    filter:
      - "**/*"
  - from: ../../dist_py/qqmusic_api/qqmusic_api
    to: backend/qqmusic_api
    filter:
      - "**/*"
  - from: ../../dist_py/netease
    to: backend/netease
    filter:
      - "**/*"
win:
  sign: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}
