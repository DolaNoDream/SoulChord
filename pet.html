<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>桌宠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 窗口大小固定，必须与 main.js 中的 width/height 完全一致 */
        html, body {
            width: 200px;      /* ← 根据你的素材调整 */
            height: 200px;     /* ← 根据你的素材调整 */
            background: transparent !important;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        canvas {
            display: block;
            width: 200px;      /* ← 与窗口相同 */
            height: 200px;     /* ← 与窗口相同 */
            background: transparent;
        }
        #bubble {
            position: absolute;
            background: rgba(255,255,255,0.92);
            border-radius: 16px;
            padding: 10px 16px;
            max-width: 220px;
            font-size: 15px;
            color: #333;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: normal;
            word-break: break-word;
            line-height: 1.5;
            left: 50%;
            top: -12px;
            transform: translate(-50%, -100%);
            z-index: 10;
        }
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid transparent;
            border-top-color: rgba(255,255,255,0.92);
        }
    </style>
</head>
<body>
<canvas id="petCanvas"></canvas>
<div id="bubble"></div>

<script>
(function() {
    // ==================== 窗口固定尺寸（必须与 main.js 完全相同） ====================
    const WIN_W = 200;
    const WIN_H = 200;

    // ==================== 素材配置 ====================
    const DAY_SPRITES = {
        idle:    ['assets/day/idle_1.png','assets/day/idle_2.png','assets/day/idle_3.png','assets/day/idle_4.png','assets/day/idle_5.png'],
        idle10s: ['assets/day/idle10s_1.png','assets/day/idle10s_2.png'],
        idle20s: ['assets/day/idle20s_1.png','assets/day/idle20s_2.png'],
        click:   ['assets/day/click.png'],
        drag:    ['assets/day/drag.png']
    };
    const NIGHT_SPRITES = {
        idle:    ['assets/night/idle_1.png','assets/night/idle_2.png','assets/night/idle_3.png','assets/night/idle_4.png','assets/night/idle_5.png'],
        idle10s: ['assets/night/idle10s_1.png','assets/night/idle10s_2.png'],
        idle20s: ['assets/night/idle20s_1.png','assets/night/idle20s_2.png'],
        click:   ['assets/night/click.png'],
        drag:    ['assets/night/drag.png']
    };

    // ==================== 可调参数 ====================
    const IDLE_FRAME_SPEED = 30;
    const CLICK_DISPLAY_MS = 500;
    const TIME_TO_IDLE_10S = 10000;
    const TIME_TO_IDLE_20S = 20000;
    const AUTO_SWITCH_THEME = true;

    // ==================== 全局状态 ====================
    const canvas = document.getElementById('petCanvas');
    const ctx = canvas.getContext('2d');
    const bubble = document.getElementById('bubble');

    let currentTheme = 'day';
    let petState = 'idle';
    let animFrame = 0;
    let animTimer = 0;
    let isDragging = false;

    // 窗口屏幕坐标（记录当前窗口位置，拖动时使用）
    let winX = 500, winY = 300;
    let dragStartScreenX = 0, dragStartScreenY = 0;
    let dragStartWinX = 0, dragStartWinY = 0;

    let lastInteractionTime = performance.now();
    let clickStartTime = 0;
    let bubbleTimer = 0;

    // ==================== 图片加载 ====================
    const images = {};
    function loadSprites(theme, config) {
        for (const [state, paths] of Object.entries(config)) {
            paths.forEach((path, idx) => {
                const key = `${theme}_${state}_${idx}`;
                images[key] = new Image();
                images[key].src = path;
            });
        }
    }
    function loadAllImages() {
        loadSprites('day', DAY_SPRITES);
        loadSprites('night', NIGHT_SPRITES);
    }

    // ==================== 获取当前应显示的图片 ====================
    function getCurrentSpriteConfig() {
        return currentTheme === 'day' ? DAY_SPRITES : NIGHT_SPRITES;
    }
    function getCurrentImage() {
        const sprites = getCurrentSpriteConfig();
        let paths;
        if (petState === 'idle')          paths = sprites.idle;
        else if (petState === 'idle10s')  paths = sprites.idle10s;
        else if (petState === 'idle20s')  paths = sprites.idle20s;
        else if (petState === 'click')    paths = sprites.click;
        else if (petState === 'drag')     paths = sprites.drag;
        else paths = sprites.idle;
        const frameIdx = Math.min(animFrame, paths.length - 1);
        const key = `${currentTheme}_${petState}_${frameIdx}`;
        return images[key] || images[`${currentTheme}_idle_0`] || null;
    }

    // ==================== 动画更新 ====================
    function updateAnimation(now) {
        const sprites = getCurrentSpriteConfig();
        if (petState === 'idle' || petState === 'idle10s' || petState === 'idle20s') {
            const elapsed = now - lastInteractionTime;
            if (elapsed >= TIME_TO_IDLE_20S && petState !== 'idle20s') {
                petState = 'idle20s'; animFrame = 0; animTimer = 0;
            } else if (elapsed >= TIME_TO_IDLE_10S && elapsed < TIME_TO_IDLE_20S && petState !== 'idle10s') {
                petState = 'idle10s'; animFrame = 0; animTimer = 0;
            } else if (elapsed < TIME_TO_IDLE_10S && petState !== 'idle') {
                petState = 'idle'; animFrame = 0; animTimer = 0;
            }
            const paths = sprites[petState] || sprites.idle;
            const maxFrames = paths.length;
            animTimer++;
            if (animTimer >= IDLE_FRAME_SPEED) {
                animTimer = 0;
                animFrame = (animFrame + 1) % maxFrames;
            }
        } else if (petState === 'click') {
            if (now - clickStartTime >= CLICK_DISPLAY_MS) {
                petState = 'idle';
                animFrame = 0; animTimer = 0;
                lastInteractionTime = now;
            }
        } else if (petState === 'drag') {
            animFrame = 0;
        }
    }

    // ==================== 绘制（固定在 Canvas 正中） ====================
    function draw() {
        // 强制固定 Canvas 尺寸，不使用 window.innerWidth
        canvas.width = WIN_W;
        canvas.height = WIN_H;
        ctx.clearRect(0, 0, WIN_W, WIN_H);

        const img = getCurrentImage();
        if (img && img.complete && img.naturalWidth > 0) {
            const scale = Math.min(WIN_W / img.naturalWidth, WIN_H / img.naturalHeight);
            const drawW = img.naturalWidth * scale;
            const drawH = img.naturalHeight * scale;
            const drawX = (WIN_W - drawW) / 2;
            const drawY = (WIN_H - drawH) / 2;
            ctx.drawImage(img, drawX, drawY, drawW, drawH);
        } else {
            // 占位绘制（图片未加载时显示黄点）
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(WIN_W/2, WIN_H/2, WIN_W*0.35, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('…', WIN_W/2, WIN_H/2+5);
        }
    }

    // ==================== 气泡系统 ====================
    function showBubble(text, durationMs = 2500) {
        bubble.textContent = text;
        bubble.style.opacity = '1';
        bubbleTimer = durationMs;
    }
    function hideBubble() {
        bubble.style.opacity = '0';
        bubbleTimer = 0;
    }
    function updateBubble(dt) {
        if (bubbleTimer > 0) {
            bubbleTimer -= dt;
            if (bubbleTimer <= 0) hideBubble();
        }
    }

    // ==================== 主题切换 ====================
    function setTheme(theme) {
        if (theme === currentTheme) return;
        if (theme !== 'day' && theme !== 'night') return;
        currentTheme = theme;
        animFrame = 0; animTimer = 0;
    }
    function autoThemeByTime() {
        const hour = new Date().getHours();
        setTheme(hour >= 18 || hour < 6 ? 'night' : 'day');
    }

    // ==================== 预留接口 ====================
    function onClick() {
        console.log('[桌宠] 被点击了');
    }
    function onDragStart() {
        console.log('[桌宠] 开始拖动');
    }
    function onDragEnd() {
        console.log('[桌宠] 拖动结束');
    }
    function showMessage(text, durationMs = 2500) {
        showBubble(text, durationMs);
    }
    function switchToDay() { setTheme('day'); }
    function switchToNight() { setTheme('night'); }

    // ==================== 交互（拖动 = 移动窗口） ====================
    // 整个窗口都是可拖区域，鼠标按下即开始拖动
    function startDrag(screenX, screenY) {
        isDragging = true;
        dragStartScreenX = screenX;
        dragStartScreenY = screenY;
        dragStartWinX = winX;
        dragStartWinY = winY;
        petState = 'drag';
        animFrame = 0;
        hideBubble();
        lastInteractionTime = performance.now();
        onDragStart();
    }
    function moveDrag(screenX, screenY) {
        if (!isDragging) return;
        const dx = screenX - dragStartScreenX;
        const dy = screenY - dragStartScreenY;
        const newWinX = dragStartWinX + dx;
        const newWinY = dragStartWinY + dy;
        winX = newWinX;
        winY = newWinY;
        if (window.electronAPI && window.electronAPI.moveWindow) {
            window.electronAPI.moveWindow(newWinX, newWinY);
        }
    }
    function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        petState = 'click';
        animFrame = 0;
        clickStartTime = performance.now();
        lastInteractionTime = performance.now();
        onDragEnd();
        onClick();
    }

    canvas.addEventListener('mousedown', e => startDrag(e.screenX, e.screenY));
    window.addEventListener('mousemove', e => moveDrag(e.screenX, e.screenY));
    window.addEventListener('mouseup', () => endDrag());

    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const t = e.touches[0];
        startDrag(t.screenX, t.screenY);
    });
    window.addEventListener('touchmove', e => {
        e.preventDefault();
        if (isDragging) moveDrag(e.touches[0].screenX, e.touches[0].screenY);
    });
    window.addEventListener('touchend', e => {
        e.preventDefault();
        endDrag();
    });

    // ==================== 主循环 ====================
    let lastFrameTime = performance.now();
    function gameLoop(now) {
        const dt = now - lastFrameTime;
        lastFrameTime = now;

        updateAnimation(now);
        updateBubble(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    // ==================== 启动 ====================
    function init() {
        loadAllImages();
        if (AUTO_SWITCH_THEME) {
            autoThemeByTime();
            setInterval(autoThemeByTime, 60000);
        }
        lastInteractionTime = performance.now();
        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);

        // 暴露 API 到全局
        window.petAPI = {
            showMessage,
            switchToDay,
            switchToNight,
            setTheme,
            getTheme: () => currentTheme,
            getState: () => petState
        };
        console.log('🦕 桌宠已就绪');
    }

    init();
})();
</script>
</body>
</html>
